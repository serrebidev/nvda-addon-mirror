name = addonStoreMirror
summary = "SerrebiRadio Add-on Store Mirror"
description = """Points NVDA's built-in Add-on Store at the SerrebiRadio mirror, which combines the official, direct-author, BestMidi, Russian, and Spanish NVDA add-on catalogs. Displays each add-on's upstream source in the Store list. Download links still point at the original hosts."""
author = "SerrebiRadio <serrebi101@gmail.com>"
url = https://github.com/serrebidev/nvda-addon-mirror
version = 1.5.0-dev10
changelog = """1.5.0-dev10 (local test build):
- Choose a GitHub changelog source without preloading or counts; load only the selected source and request older history explicitly.
- Discover changelog files with one repository listing and read them only when selected.
- Reuse cached pages and pause requests across sources when GitHub rate limits are reached.

1.5.0-dev9 (local test build):
- Remove unreliable first-publication display; show the listed version's catalog date as Last updated and explain its meaning.
- All available changelog sources now checks availability in the background, hides empty sources and shows item counts with partial-retrieval status.
- Preserve earlier date preferences and avoid duplicate Last updated choices.

1.5.0-dev8 (local test build):
- Fix settings Save and destroyed Store windows; keep native keyboard behavior.
- Copy the selected add-on's share details with Ctrl+C in the Store list.
- Separate last-updated metadata from sourced first-publication dates; sort unknown values last.
- Ask for a changelog source when All sources is selected; read common repository changelog files and separate GitHub development commit history.

1.5.0-dev7 (local test build):
- Configure default sort and channel for each tab; rearrange tabs and sort choices.
- Add installed or available add-ons to the new Favourites tab; Ctrl+1 through Ctrl+5 select tabs.
- Optionally apply sorting only on Enter and announce Name followed by the active sort column.
- Choose changelog sources in settings; Tab reads notes before the read-only history status.
- Extend changelog history, correct date-sort mapping, and keep unknown dates last.

1.4.5:
- Share add-on details and copy the selected release's download link from the existing actions menu.
- Choose All text, Title, Author or publisher, Description, Add-on ID, or Source when searching.
- New discovery actions: more by the same author, more like the selected add-on, open the installed folder, and open or clone the verified GitHub repository.
- View an add-on's changelog history and sort the store list by last updated.
- The store remembers the browsing position, and the Source column can be configured.
- Choose the default add-on store: mirror, official NVDA store, original store, or a custom HTTPS URL. Update checks stay scoped to the selected source.

1.4.4:
- With Search while typing unchecked, Enter and numpad Enter now apply the search instead of doing nothing on Windows.
- The regular Add-on Store and official NVDA store now share an Add-on Store submenu in Tools.

1.4.3:
- Answering Yes to the duplicate add-ons warning now installs the first selected version of each; before, Yes cancelled the install.
- Closing the official store opened from the Tools menu with its Close button now switches back to the mirror. Before, the regular Add-on Store kept showing the official store until NVDA restarted.
- The Source column now also shows for installed add-ons.
- Installing from a bundle, and fetching the mirror catalog for bundle export and import, no longer freeze NVDA: downloads run in the background while NVDA keeps speaking.
- Bundle import no longer offers an older bundle version as an update. It is listed as older than the installed version and is not selected by default.

1.4.2:
- Fixes the empty settings panel on NVDA 2026.3.
- Cleans up Tools menu items and their submenus together during shutdown.

1.4.1:
- Fixes an NVDA log error on startup: the bundle helper module is now underscore-prefixed so NVDA's plugin loader no longer mistakes it for a global plugin. Updating from 1.4.0 also removes the stale module file automatically.

1.4.0:
- Add-on bundles: the Tools menu gains an "Add-on bundles" submenu. "Export installed add-ons as bundle..." saves your installed add-ons as a small .nvda-bundle file (download links only, never the add-ons themselves), and "Install add-ons from bundle file..." installs all or selected add-ons from someone else's bundle in one go, with a single restart at the end. Bundle entries can track the latest version or pin an exact version with its checksum. Handy for sharing an add-on setup or reinstalling everything after a fresh NVDA install.

1.3.8:
- The Tools menu no longer adds a mirror entry: the regular Add-on Store option already opens the SerrebiRadio mirror, so only the "Add-on store (official NVDA store)" entry is added.

1.3.7:
- Fixes the Add-on Store failing to open on recent NVDA alpha builds: NVDA now passes its sizer helper to the dialog's filter-controls builder, and the helper's search wrapper forwards it instead of raising TypeError.

1.3.6:
- The Tools menu now has two Add-on Store entries: "Add-on store (mirror)" browses the SerrebiRadio mirror, and "Add-on store (official NVDA store)" browses NVDA's official store, switching back to the mirror when its dialog closes.
- New "Search while typing in the Add-on Store" setting under NVDA menu > Preferences > Settings > SerrebiRadio add-on store. Turn it off and the store list only filters when Enter is pressed in the search field, instead of re-filtering on every keystroke.
- Selecting the same add-on more than once for install or update (for example its stable and dev versions) now asks whether to install the first selected version of each, instead of silently installing only one.

1.3.5:
- Add-on names that were descriptions or placeholders are fixed. "NVDA add-on", "Addon for NVDA" and similar template text is never used as a name; the add-on's real name is shown instead. Names that come from a catalog's own title keep their spelling (PowerPoint, n8n, Axe-Edit). 62 add-ons got hand-written English names, such as Inform 7 Access, Diary for NVDA and Thunderbird+ G5.1.

1.3.4:
- Corrective release: the English->locale machine-translation tier is gone. Translation duty is non-English -> English only, maintained by hand in translations.json. Non-English locales now show the official store's own translations and author-supplied bundle translations; everything else stays in English. The translationSeed.json merge and the translationRequests.json queue were removed.

1.3.3:
- Released alongside a translation fix: OpenRouter no longer handles translations. Each build merges the maintainer's translationSeed.json over the translation cache and publishes remaining gaps as translationRequests.json; the maintainer is the translation engine.

1.3.2:
- Released alongside a mirror fix: a truncated machine-translation reply no longer kills the whole catalog build; the gap simply stays English until the next build.

1.3.1:
- Released alongside a mirror fix: add-on names and descriptions translated into English no longer switch back to the original language on every other catalog update.

1.3.0:
- Refreshed the helper add-on alongside the mirror's catalog-cache release.

1.2.3:
- Raised lastTestedNVDAVersion to NVDA 2027.1. NVDA master has moved BACK_COMPAT_TO to 2027.1.0 (the Python 3.14 upgrade), so an add-on still claiming 2026.2 stops loading entirely on NVDA 2027.1 rather than merely looking out of date. This is a compatibility floor, not a claim that 2027.1 has shipped.

1.2.2:
- Refreshed lastTestedNVDAVersion to NVDA 2026.2, the current stable release. The previous 2026.3.0 claimed a version that has not shipped: NVDA 2026.3 is still listed as experimental by NV Access.

1.2.1:
- Requires NVDA 2025.1, the first release with a configurable Add-on Store URL. NVDA 2023.2 to 2024.4 hardcode the official store address, so earlier builds of this add-on could only fail on them.
- Failing to read the Add-on Store URL no longer leaves NVDA's Add-on Store list permanently modified.

1.2.0:
- Added a Source column to available add-ons and search results.
- Add-on sources can now be found by typing a store or release source in Search.
- Preserves source information for add-ons installed from the mirror.

1.1.1:
- Fixed an NVDA Add-on Store crash caused by replacing the live add-on data manager singleton.
- Refreshes through NVDA's existing manager after its initial fetch completes.
- Preserves the original official or custom store URL across NVDA restarts.

1.1.0:
- Fixed the mirror URL (removed the trailing slash that produced double slashes in store requests).
- The mirror now publishes a browsable page of rejected candidates."""
minimumNVDAVersion = 2025.1.0
lastTestedNVDAVersion = 2027.1.0
