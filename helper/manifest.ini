name = addonStoreMirror
summary = "SerrebiRadio Add-on Store Mirror"
description = """Points NVDA's built-in Add-on Store at the SerrebiRadio mirror, which combines the official, direct-author, BestMidi, Russian, and Spanish NVDA add-on catalogs. Displays each add-on's upstream source in the Store list. Download links still point at the original hosts."""
author = "SerrebiRadio <serrebi101@gmail.com>"
url = https://github.com/serrebidev/nvda-addon-mirror
version = 1.2.0
changelog = """1.2.0:
- Added a Source column to available add-ons and search results.
- Add-on sources can now be found by typing a store or release source in Search.
- Preserves source information for add-ons installed from the mirror.

1.1.1:
- Fixed an NVDA Add-on Store crash caused by replacing the live add-on data manager singleton.
- Refreshes through NVDA's existing manager after its initial fetch completes.
- Preserves the original official or custom store URL across NVDA restarts.

1.1.0:
- Fixed the mirror URL (removed the trailing slash that produced double slashes in store requests).
- The mirror now publishes a browsable page of rejected candidates."""
minimumNVDAVersion = 2023.2.0
lastTestedNVDAVersion = 2026.3.0
