name: update-mirror

on:
  push:
    branches:
      - main
  schedule:
    # One run an hour, offset from the top of the hour when GitHub says
    # scheduled jobs are most likely to be delayed or dropped. High-frequency
    # crons get throttled by the platform, so this is the cadence it reliably
    # honors; hourly builds also stay well inside the GITHUB_TOKEN API budget
    # of 1000 requests/hour even when every cached ETag has expired.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Translation audit: manage the translation-gap issue. Report-only for the
  # build itself; findings never block the deployment.
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The whole workflow shares the "pages" concurrency group, so a hung build
    # would hold every later refresh behind it for GitHub's 6-hour default. A
    # full run takes minutes; give it room and then let the next cron retry.
    timeout-minutes: 60
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Restore build caches
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            hashcache.json
            githubOwnerCache.json
            .bundlecache
          key: mirror-downloads-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mirror-downloads-v2-

      - name: Restore hash cache from last deployment
        if: steps.build-cache.outputs.cache-matched-key == ''
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          URL="https://${OWNER}.github.io/${REPO}/hashcache.json"
          echo "Restoring hash cache from ${URL}"
          curl --retry 3 -fsSL "$URL" -o hashcache.json.tmp
          python -c 'import json; assert isinstance(json.load(open("hashcache.json.tmp")), dict)'
          mv hashcache.json.tmp hashcache.json

      - name: Restore GitHub author manifest cache
        if: steps.build-cache.outputs.cache-matched-key == ''
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          URL="https://${OWNER}.github.io/${REPO}/githubOwnerCache.json"
          echo "Restoring GitHub author cache from ${URL}"
          curl --retry 3 -fsSL "$URL" -o githubOwnerCache.json.tmp
          python -c 'import json; assert isinstance(json.load(open("githubOwnerCache.json.tmp")), dict)'
          mv githubOwnerCache.json.tmp githubOwnerCache.json

      - name: Test mirror
        run: python -W error -m unittest discover -s tests

      - name: Build mirror
        id: mirror-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python mirror.py --out public

      - name: Save build caches even if publication fails
        if: always() && steps.mirror-build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            hashcache.json
            githubOwnerCache.json
            .bundlecache
          key: mirror-downloads-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Audit the built catalog
        run: |
          python - <<'PYEOF'
          import sys
          import mirror
          problems = mirror.audit_catalog("public")
          for problem in problems:
              print(problem)
          if problems:
              sys.exit(1)
          print("Catalog audit passed: every per-version file matches its release's BACK_COMPAT_TO.")
          PYEOF

      - name: Audit translations of the built catalog
        # Report-only. Exit 1 from the auditor means "found gaps", which is
        # data for translation_issue.py, not a failure; and any hard error
        # here (e.g. the API rejecting issue access) must never block the
        # deployment of the mirror itself.
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python audit_translations.py --addons public/addons.json --json findings.json || true
          python translation_issue.py sync findings.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        # deploy-pages v5 currently carries a known @actions/artifact punycode
        # deprecation. Limit suppression to this upstream action only.
        env:
          NODE_OPTIONS: --no-deprecation
