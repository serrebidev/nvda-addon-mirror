name: update-mirror

on:
  push:
    branches:
      - main
  schedule:
    # Offset from the top of the hour, when GitHub says scheduled jobs are most
    # likely to be delayed or dropped. The keep-alive job below also dispatches
    # the next run, because cron delivery alone is not guaranteed.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The whole workflow shares the "pages" concurrency group, so a hung build
    # would hold every later refresh behind it for GitHub's 6-hour default. A
    # full run takes minutes; give it room and then let the next cron retry.
    timeout-minutes: 60
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Restore hash cache from last deployment
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          URL="https://${OWNER}.github.io/${REPO}/hashcache.json"
          echo "Restoring hash cache from ${URL}"
          curl -fsSL "$URL" -o hashcache.json || echo "No previous cache (first run)."

      - name: Restore GitHub author manifest cache
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          URL="https://${OWNER}.github.io/${REPO}/githubOwnerCache.json"
          echo "Restoring GitHub author cache from ${URL}"
          curl -fsSL "$URL" -o githubOwnerCache.json || echo "No previous author cache (first run)."

      - name: Build mirror
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python mirror.py --out public

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        # deploy-pages v5 currently carries a known @actions/artifact punycode
        # deprecation. Limit suppression to this upstream action only.
        env:
          NODE_OPTIONS: --no-deprecation

  schedule-next:
    # GitHub documents that scheduled events can be delayed or dropped. Keep a
    # ten-minute chain alive with the repository-scoped GITHUB_TOKEN; cron above
    # remains a watchdog that restarts the chain if a run is ever interrupted.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait for the next refresh interval
        run: sleep 600

      - name: Dispatch the next refresh when none is pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIVE_RUNS="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\"))] | length")"
          if [ "$ACTIVE_RUNS" -eq 0 ]; then
            gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          else
            echo "$ACTIVE_RUNS other refresh run(s) already active; no dispatch needed."
          fi
